name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.RAVITO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravito.jks"
            echo "RAVITO_KEYSTORE_FILE=$RUNNER_TEMP/ravito.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret RAVITO_KEYSTORE_BASE64 absent : APK signé avec une clé de debug (voir README)."
          fi

      - name: Tests unitaires (lecture des SMS, rapport)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Construire l'APK
        env:
          RAVITO_KEYSTORE_PASSWORD: ${{ secrets.RAVITO_KEYSTORE_PASSWORD }}
          RAVITO_KEY_ALIAS: ${{ secrets.RAVITO_KEY_ALIAS }}
          RAVITO_KEY_PASSWORD: ${{ secrets.RAVITO_KEY_PASSWORD }}
          RAVITO_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      # Lien permanent pour les agents :
      # https://github.com/<compte>/Ravito/releases/latest/download/Ravito.apk
      - name: Publier l'APK (lien de téléchargement direct)
        if: github.event_name == 'push' && env.RAVITO_KEYSTORE_FILE != ''
        run: cp app/build/outputs/apk/release/*.apk Ravito.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && env.RAVITO_KEYSTORE_FILE != ''
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ravito 1.0.${{ github.run_number }}
          body: "Sur le téléphone : ouvrir le lien dans Chrome, télécharger Ravito.apk, puis Ouvrir. Android 6.0 minimum."
          files: Ravito.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: ravito-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
