<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ravito Gestion</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#0B8A5A">
<link rel="icon" href="/admin/icon-192.png">
<link rel="apple-touch-icon" href="/admin/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0B8A5A; --green-soft: #E3F5EC; --ink: #101418; --ink-soft: #6E7781;
    --canvas: #F2F3F6; --line: #E6E8EC; --white: #fff; --amber: #B7791F; --amber-soft: #FFF3DC;
    --red: #D93025; --red-soft: #FDECEA; --blue: #1F6FEB; --blue-soft: #E7F0FD;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--canvas); color: var(--ink); font-size: 15px; }
  button, input, select, textarea { font: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header h1 { font-size: 30px; letter-spacing: -0.8px; margin: 0; flex: 1; }
  .tabs { display: flex; gap: 6px; background: var(--white); padding: 4px; border-radius: 999px; }
  .tab { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; color: var(--ink-soft); font-weight: 500; }
  .tab.on { background: var(--green); color: #fff; }
  .btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; background: var(--green); color: #fff; }
  .btn.ghost { background: var(--white); color: var(--ink); }
  .btn.soft { background: var(--green-soft); color: var(--green); }
  .btn.danger { background: var(--red-soft); color: var(--red); }
  .btn:disabled { opacity: .5; cursor: default; }
  .card { background: var(--white); border-radius: 20px; padding: 18px 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi .l { color: var(--ink-soft); font-size: 13px; }
  .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -0.6px; margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; border: 0; background: var(--white); border-radius: 999px; padding: 11px 18px; outline: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; padding: 10px 12px; }
  td { padding: 13px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  tr.row { cursor: pointer; } tr.row:hover td { background: #FAFBFC; }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .s-paye { background: var(--green-soft); color: var(--green); }
  .s-essai { background: var(--blue-soft); color: var(--blue); }
  .s-expire { background: var(--amber-soft); color: var(--amber); }
  .s-bloque { background: var(--red-soft); color: var(--red); }
  .s-invite { background: var(--line); color: var(--ink-soft); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
  .drawer-bg { position: fixed; inset: 0; background: rgba(16,20,24,.35); display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--canvas); overflow-y: auto; padding: 22px; display: none; box-shadow: -10px 0 40px rgba(0,0,0,.1); }
  .open .drawer-bg, .open .drawer { display: block; }
  .drawer h2 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.5px; }
  .sec { font-size: 12px; text-transform: uppercase; color: var(--ink-soft); margin: 22px 4px 8px; }
  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); gap: 12px; }
  .kv:first-child { border-top: 0; }
  .kv span:first-child { color: var(--ink-soft); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; }
  .bar { flex: 1; background: var(--green-soft); border-radius: 6px 6px 2px 2px; position: relative; min-height: 2px; }
  .bar > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--green); border-radius: 6px 6px 2px 2px; }
  .list-item { padding: 10px 0; border-top: 1px solid var(--line); }
  .list-item:first-child { border-top: 0; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }
  .toggle:first-child { border-top: 0; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .input { width: 100%; border: 1px solid var(--line); background: var(--white); border-radius: 12px; padding: 11px 14px; outline: none; }
  .input:focus { border-color: var(--green); }
  .modal-bg { position: fixed; inset: 0; background: rgba(16,20,24,.35); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-bg.on { display: flex; }
  .modal { background: var(--canvas); border-radius: 24px; padding: 22px; width: min(460px, 100%); }
  .login { max-width: 400px; margin: -48px auto 0; position: relative; box-shadow: 0 18px 50px -24px rgba(16,20,24,.3); padding: 26px 24px; }
  .login-hero { background: radial-gradient(800px 300px at 90% -20%, rgba(255,255,255,.18), transparent 60%), linear-gradient(160deg, #0B8A5A, #066A44); color: #fff; text-align: center; padding: 56px 20px 84px; }
  .login-hero h1 { margin: 14px 0 6px; font-size: 30px; letter-spacing: -0.8px; }
  .login-hero p { margin: 0; opacity: .88; }
  .login-logo { width: 64px; height: 64px; margin: 0 auto; border-radius: 18px; background: #fff; color: var(--green); font-size: 34px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 10px 30px -10px rgba(0,0,0,.35); }
  header h1 { display: flex; align-items: center; gap: 10px; }
  header h1::before { content: "R"; width: 36px; height: 36px; border-radius: 11px; background: var(--green); color: #fff; font-size: 20px; display: grid; place-items: center; letter-spacing: 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; display: none; }
  .empty { text-align: center; padding: 40px; color: var(--ink-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-weight: 500; }
  .chip.on { background: var(--green); color: #fff; border-color: var(--green); }
  .claim { background: var(--amber-soft); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .link { color: var(--green); cursor: pointer; text-decoration: underline; background: none; border: 0; padding: 0; font: inherit; }
  @media (max-width: 760px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
const fmtDateTime = (ms) => ms ? new Date(ms).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const money = (n) => (Number(n) || 0).toLocaleString('fr-FR').replace(/ /g, ' ') + ' F';
const ago = (ms) => {
  if (!ms) return 'jamais';
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 2) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `il y a ${h} h`;
  return `il y a ${Math.round(h / 24)} j`;
};
const STATUS = { paye: 'Payé', essai: 'Essai', expire: 'Expiré', bloque: 'Bloqué', invite: 'Pas encore activé' };
const FLAGS = [
  ['test_sms', 'Tester un SMS'],
  ['manual_add', 'Ajout manuel d\'un envoi'],
  ['export', 'Export Excel / CSV'],
  ['edit_report', 'Modifier le texte du rapport'],
];
const state = { tab: 'clients', clients: [], prospects: [], config: null, q: '', detail: null, relance: false };
const SIGNUP_URL = location.origin + '/inscription/';
const PSTATUS = { nouveau: 'Nouveau', contacte: 'Contacté', converti: 'Accès créé', refuse: 'Refusé' };
const DAYMS = 864e5;
/** Client à relancer : essai ou abonnement qui finit dans 3 jours ou moins, ou déjà expiré. */
const needsFollowUp = (x) => x.status === 'expire' || ((x.status === 'essai' || x.status === 'paye') && x.expiry && x.expiry - Date.now() < 3 * DAYMS);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

const LOCK_MS = 15 * 60_000; // verrouillage après 15 min sans activité
const session = {
  get: () => localStorage.getItem('ravito_session'),
  set: (s) => { localStorage.setItem('ravito_session', s); touch(); },
  clear: () => localStorage.removeItem('ravito_session'),
};
function touch() { localStorage.setItem('ravito_seen', String(Date.now())); }
['click', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, () => { if (session.get()) touch(); }, { passive: true }));
setInterval(() => {
  if (session.get() && Date.now() - Number(localStorage.getItem('ravito_seen') || 0) > LOCK_MS) { session.clear(); renderLogin('Verrouillé après 15 minutes sans activité.'); }
}, 30_000);

async function api(action, data, extra = '') {
  const r = await fetch(`/api/admin?action=${action}${extra}`, {
    method: data ? 'POST' : 'GET',
    headers: { Authorization: `Bearer ${session.get() || ''}`, 'Content-Type': 'application/json' },
    body: data ? JSON.stringify(data) : undefined,
  });
  if (r.status === 401 && !['login', 'recover'].includes(action)) { session.clear(); renderLogin('Session expirée, reconnectez-vous.'); throw new Error('401'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j.error === 'confirmation') throw new Error('Mot de passe incorrect');
  if (!r.ok) throw new Error(j.error || 'erreur');
  return j;
}

/** Demande le mot de passe avant une action sensible. Renvoie le mot de passe, ou null si annulé. */
function askPassword(title, detail = '') {
  return new Promise((resolve) => {
    modal(`<h2 style="margin:0 0 6px">${esc(title)}</h2>
      ${detail ? `<p class="muted" style="margin:0 0 14px">${esc(detail)}</p>` : ''}
      <label class="field"><span>Votre mot de passe pour confirmer</span><input class="input" id="cf-pw" type="password" autocomplete="current-password"></label>
      <div class="actions"><button class="btn" id="cf-ok">Confirmer</button><button class="btn ghost" id="cf-no">Annuler</button></div>`);
    const done = (v) => { closeModal(); resolve(v); };
    $('#cf-pw').focus();
    $('#cf-ok').onclick = () => done($('#cf-pw').value.trim() || null);
    $('#cf-pw').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); done($('#cf-pw').value.trim() || null); } };
    $('#cf-no').onclick = () => done(null);
  });
}

/** Action sensible : mot de passe puis appel serveur. */
async function sensitive(action, data, title, detail) {
  const confirm = await askPassword(title, detail);
  if (!confirm) return null;
  return api(action, { ...data, confirm });
}

function renderLogin(err = '') {
  $('#app').innerHTML = `
    <div class="login-hero">
      <div class="login-logo">R</div>
      <h1>Ravito Gestion</h1>
      <p>Vos demandes, vos clients et vos paiements, au même endroit.</p>
    </div>
    <div class="wrap" style="padding-top:0"><div class="login card">
      <h2 style="margin:0 0 4px;font-size:22px;letter-spacing:-.4px">Connexion</h2>
      <p class="muted" style="margin:0 0 18px">Espace réservé à l'administrateur.</p>
      <label class="field"><span>Mot de passe</span><input class="input" id="pw" type="password" autocomplete="current-password" autofocus></label>
      <label style="display:flex;align-items:center;gap:8px;margin:-4px 0 14px;color:var(--ink-soft);font-size:14px;cursor:pointer"><input type="checkbox" id="pw-show"> Afficher le mot de passe</label>
      ${err ? `<p style="color:var(--red);margin:0 0 12px">${esc(err)}</p>` : ''}
      <button class="btn" id="go" style="width:100%">Se connecter</button>
      <p style="text-align:center;margin:16px 0 0"><button class="link" id="forgot">Mot de passe oublié ?</button></p>
    </div></div>
    <div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>`;
  $('#pw-show').onchange = (e) => { $('#pw').type = e.target.checked ? 'text' : 'password'; $('#pw').focus(); };
  const go = async () => {
    $('#go').disabled = true;
    try { const j = await api('login', { password: $('#pw').value.trim() }); session.set(j.session); await load(); }
    catch (e) { if (e.message !== '401') renderLogin('Mot de passe incorrect.'); }
  };
  $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  $('#forgot').onclick = openRecover;
}

function openRecover() {
  modal(`<h2 style="margin:0 0 6px">Mot de passe oublié</h2>
    <p class="muted" style="margin:0 0 14px">Entrez votre code de secours (format XXXX-XXXX-XXXX), puis choisissez un nouveau mot de passe.</p>
    <label class="field"><span>Code de secours</span><input class="input mono" id="rc-code" autocomplete="off"></label>
    <label class="field"><span>Nouveau mot de passe (8 caractères minimum)</span><input class="input" id="rc-pw" type="password"></label>
    <label class="field"><span>Répétez le nouveau mot de passe</span><input class="input" id="rc-pw2" type="password"></label>
    <p id="rc-err" style="color:var(--red);margin:0 0 12px;display:none"></p>
    <div class="actions"><button class="btn" id="rc-ok">Réinitialiser</button><button class="btn ghost" id="rc-no">Annuler</button></div>`);
  $('#rc-no').onclick = closeModal;
  $('#rc-ok').onclick = async () => {
    const err = $('#rc-err'); err.style.display = 'none';
    if ($('#rc-pw').value !== $('#rc-pw2').value) { err.textContent = 'Les deux mots de passe sont différents.'; err.style.display = 'block'; return; }
    try {
      const j = await api('recover', { recovery: $('#rc-code').value, password: $('#rc-pw').value });
      session.set(j.session); showRecovery(j.recovery, () => load());
    } catch (e) { err.textContent = e.message === 'code_secours' || e.message === '401' ? 'Code de secours incorrect.' : e.message; err.style.display = 'block'; }
  };
}

/** Affiche le NOUVEAU code de secours, à noter avant de continuer. */
function showRecovery(code, then) {
  modal(`<h2 style="margin:0 0 6px">Votre code de secours</h2>
    <p class="muted" style="margin:0 0 14px">Gardez-le précieusement (photo, carnet, message à vous-même). Il sert si vous oubliez votre mot de passe. L'ancien code ne marche plus.</p>
    <div class="card mono" style="font-size:24px;text-align:center;letter-spacing:2px">${esc(code)}</div>
    <div class="actions" style="margin-top:14px"><button class="btn soft" id="sr-copy">Copier</button><button class="btn" id="sr-ok">Je l'ai noté</button></div>`);
  $('#sr-copy').onclick = () => { navigator.clipboard.writeText(code); toast('Code copié'); };
  $('#sr-ok').onclick = () => { closeModal(); then && then(); };
}

async function load() {
  try {
    const [j, p] = await Promise.all([api('list'), api('prospects')]);
    state.clients = j.clients; state.config = j.config; state.prospects = p.prospects;
    render();
  } catch (e) { if (e.message !== '401') toast('Erreur : ' + e.message); }
}

function render() {
  const c = state.clients;
  const count = (s) => c.filter((x) => x.status === s).length;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
  const revenue = c.flatMap((x) => x.payments).filter((p) => p.at >= monthStart.getTime()).reduce((t, p) => t + (p.amount || 0), 0);
  const q = state.q.trim().toLowerCase();
  const rows = c.filter((x) => (!state.relance || needsFollowUp(x)) && (!q || [x.name, x.phone, x.code, x.email].some((v) => String(v || '').toLowerCase().includes(q))));
  const toFollow = c.filter(needsFollowUp).length;

  $('#app').innerHTML = `
  <div class="wrap">
    <header>
      <h1>Ravito Gestion</h1>
      <div class="tabs">
        <button class="tab ${state.tab === 'clients' ? 'on' : ''}" data-tab="clients">Clients</button>
        <button class="tab ${state.tab === 'prospects' ? 'on' : ''}" data-tab="prospects">Demandes${state.prospects.filter((p) => p.status === 'nouveau').length ? ` <span class="pill s-bloque" style="padding:1px 7px">${state.prospects.filter((p) => p.status === 'nouveau').length}</span>` : ''}</button>
        <button class="tab ${state.tab === 'settings' ? 'on' : ''}" data-tab="settings">Réglages</button>
      </div>
      <button class="btn ghost" id="install" style="display:none">Installer l'app</button>
      <button class="btn ghost" id="logout">Déconnexion</button>
    </header>
    ${state.tab === 'clients' ? `
    <div class="kpis">
      <div class="card kpi"><div class="l">Clients</div><div class="v">${c.length}</div></div>
      <div class="card kpi"><div class="l">En essai</div><div class="v">${count('essai')}</div></div>
      <div class="card kpi"><div class="l">Payés</div><div class="v">${count('paye')}</div></div>
      <div class="card kpi"><div class="l">Expirés</div><div class="v">${count('expire')}</div></div>
      <div class="card kpi"><div class="l">Encaissé ce mois</div><div class="v">${money(revenue)}</div></div>
      <div class="card kpi"><div class="l">Paiements à vérifier</div><div class="v" style="color:${c.some((x) => x.claim) ? 'var(--amber)' : 'inherit'}">${c.filter((x) => x.claim).length}</div></div>
    </div>
    <div class="toolbar">
      <input class="search" id="q" placeholder="Rechercher un nom, un numéro, un code" value="${esc(state.q)}">
      <button class="btn ${state.relance ? '' : 'ghost'}" id="relance">À relancer (${toFollow})</button>
      <button class="btn" id="new">+ Nouveau client</button>
      <button class="btn ghost" id="refresh">Actualiser</button>
    </div>
    <div class="card" style="padding:6px 8px">
      ${rows.length ? `<table>
        <thead><tr><th>Client</th><th>Code</th><th>Statut</th><th class="hide-sm">Fin</th><th class="hide-sm">Dernière activité</th><th class="hide-sm">Envois 7 j</th><th class="hide-sm">Version</th></tr></thead>
        <tbody>${rows.map((x) => `
          <tr class="row" data-code="${esc(x.code)}">
            <td><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)}</div></td>
            <td class="mono">${esc(x.code)}</td>
            <td><span class="pill s-${x.status}">${STATUS[x.status]}</span>${x.claim ? ' <span class="pill s-expire">💰 a payé ?</span>' : ''}${x.errorsCount ? ' <span class="pill s-bloque">⚠ ' + x.errorsCount + '</span>' : ''}</td>
            <td class="hide-sm">${fmtDate(x.expiry)}</td>
            <td class="hide-sm">${ago(x.lastSeen)}</td>
            <td class="hide-sm">${x.sends7}</td>
            <td class="hide-sm muted">${esc(x.versionName || '—')}</td>
          </tr>`).join('')}</tbody></table>` : `<div class="empty">Aucun client. Créez le premier avec « Nouveau client ».</div>`}
    </div>` : state.tab === 'prospects' ? renderProspects() : renderSettings()}
  </div>
  <div id="drawer"><div class="drawer-bg"></div><div class="drawer" id="drawer-body"></div></div>
  <div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>`;

  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  $('#logout').onclick = () => { session.clear(); renderLogin(); };
  if (deferredInstall) { $('#install').style.display = ''; $('#install').onclick = async () => { deferredInstall.prompt(); deferredInstall = null; $('#install').style.display = 'none'; }; }
  if (state.tab === 'clients') {
    $('#q').oninput = (e) => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); };
    $('#new').onclick = openCreate;
    $('#relance').onclick = () => { state.relance = !state.relance; render(); };
    $('#refresh').onclick = load;
    document.querySelectorAll('tr.row').forEach((tr) => tr.onclick = () => openDetail(tr.dataset.code));
  } else if (state.tab === 'prospects') bindProspects(); else bindSettings();
  $('.drawer-bg').onclick = closeDetail;
}

function renderSettings() {
  const c = state.config || {};
  return `<div class="card" style="max-width:560px">
    <label class="field"><span>Prix mensuel (F CFA)</span><input class="input" id="c-price" type="number" value="${esc(c.priceFcfa)}"></label>
    <label class="field"><span>Numéro Orange Money affiché aux clients</span><input class="input" id="c-om" value="${esc(c.omNumber)}"></label>
    <label class="field"><span>Durée de l'essai gratuit (jours)</span><input class="input" id="c-trial" type="number" value="${esc(c.trialDays)}"></label>
    <label class="field"><span>Jours de tolérance après expiration</span><input class="input" id="c-grace" type="number" value="${esc(c.graceDays)}"></label>
    <label class="field"><span>Connexion Internet obligatoire au moins tous les (jours)</span><input class="input" id="c-check" type="number" value="${esc(c.checkDays)}"></label>
    <label class="field"><span>Message affiché à tous les utilisateurs (laisser vide pour aucun)</span><textarea class="input" id="c-notice" rows="3">${esc(c.notice)}</textarea></label>
    <button class="btn" id="c-save">Enregistrer</button>

function bindSettings() {
  pushStatus();
  $('#n-on').onclick = enablePush;
  $('#n-test').onclick = async () => { try { const j = await api('test_push', {}); toast(j.sent ? `Notification envoyée à ${j.sent} appareil(s)` : 'Aucun appareil abonné'); } catch (e) { toast('Erreur : ' + e.message); } };
  $('#p-save').onclick = async () => {
    if ($('#p-new').value.length < 8) return toast('8 caractères minimum');
    if ($('#p-new').value !== $('#p-new2').value) return toast('Les deux mots de passe sont différents');
    try {
      const j = await sensitive('set_password', { password: $('#p-new').value }, 'Changer le mot de passe', 'Entrez votre mot de passe ACTUEL.');
      if (j) { session.set(j.session); showRecovery(j.recovery); }
    } catch (e) { toast('Erreur : ' + e.message); }
  };
  $('#p-rec').onclick = async () => {
    const cur = await askPassword('Nouveau code de secours', 'Votre mot de passe actuel est conservé ; seul le code de secours change.');
    if (!cur) return;
    try { const j = await api('set_password', { confirm: cur, password: cur }); session.set(j.session); showRecovery(j.recovery); } catch (e) { toast('Erreur : ' + e.message); }
  };
  $('#c-save').onclick = async () => {
    try {
      const j = await sensitive('config', {
        priceFcfa: $('#c-price').value, omNumber: $('#c-om').value, trialDays: $('#c-trial').value,
        graceDays: $('#c-grace').value, checkDays: $('#c-check').value, notice: $('#c-notice').value,
      }, 'Enregistrer les réglages');
      if (!j) return;
      state.config = j.config; toast('Réglages enregistrés');
    } catch (e) { toast('Erreur : ' + e.message); }
  };
}

function modal(html) { $('#modal-body').innerHTML = html; $('#modal').classList.add('on'); $('#modal').onclick = (e) => { if (e.target.id === 'modal') closeModal(); }; }
function closeModal() { $('#modal').classList.remove('on'); }

function inviteMessage(x) {
  return `Bonjour ${x.name},\n\nVoici Ravito, votre rapport du soir automatique.\n\n1. Ouvrez ce lien dans Chrome et installez l'application :\nhttps://github.com/essanchristian-maker/Ravito/releases/latest/download/Ravito.apk\n\n2. Au démarrage, entrez votre code personnel : ${x.code}\n\nEssai gratuit de ${x.trialDays || state.config.trialDays} jours. Ce code ne fonctionne que sur un seul téléphone.\nPrévoyez au moins 1 Go de mémoire libre.`;
}

function waLink(phone, text) {
  let p = String(phone || '').replace(/\D/g, '');
  if (p.length === 10) p = '225' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}

function openCreate() {
  modal(`<h2 style="margin:0 0 16px">Nouveau client</h2>
    <label class="field"><span>Nom</span><input class="input" id="n-name" placeholder="ex. Koffi Yao"></label>

function showInvite(x) {

        <div class="actions" style="margin-top:14px">

          <button class="btn soft" id="m-copy">Copier</button><button class="btn ghost" id="m-close">Fermer</button>
        </div>`);

function closeDetail() { $('#drawer').classList.remove('open'); state.detail = null; }

async function openDetail(code) {
  $('#drawer').classList.add('open');
  $('#drawer-body').innerHTML = '<p class="muted">Chargement…</p>';
  try {
    state.detail = await api('detail', null, `&code=${encodeURIComponent(code)}`);
    renderDetail();
  } catch (e) { $('#drawer-body').innerHTML = `<p>Erreur : ${esc(e.message)}</p>`; }
}

function renderDetail() {

  const days = [];
  for (let i = 13; i >= 0; i--) { const t = new Date(Date.now() - i * 864e5); days.push(t.toISOString().slice(0, 10)); }
  const vals = days.map((k) => d.stats[k]?.sends || 0); const max = Math.max(1, ...vals);
  const totals = (key) => days.reduce((t, k) => t + (d.stats[k]?.[key] || 0), 0);

  $('#drawer-body').innerHTML = `
    <div style="display:flex;align-items:start;gap:10px">
      <div style="flex:1"><h2>${esc(x.name)}</h2><div class="muted">${esc(x.phone)} · <span class="mono">${esc(x.code)}</span></div></div>
      <button class="btn ghost" id="d-close">Fermer</button>
    </div>

      <div class="kv"><span>Payé jusqu'au</span><span>${fmtDate(x.paidUntil)}</span></div>
      <div class="kv"><span>Paiements</span><span>${x.payments.length ? x.payments.map((p) => `${fmtDate(p.at)} : ${money(p.amount)} (${p.months || 1} mois)`).join('<br>') : '—'}</span></div>
    </div>
    <div class="sec">Enregistrer un paiement</div>
    <div class="card">
      ${x.claim ? `<div class="claim"><b>💰 ${esc(x.name)} dit avoir payé ${money(x.claim.amount)} (${x.claim.months} mois)</b><div class="muted">le ${fmtDateTime(x.claim.at)} · vérifiez votre Orange Money</div>
        <div class="actions" style="margin-top:10px"><button class="btn" id="cl-ok">Valider ${x.claim.months} mois</button><button class="btn ghost" id="cl-no">Ignorer</button></div></div>` : ''}
      <div class="muted">Durée payée</div>
      <div class="chips">${[1, 2, 3, 4, 6, 8, 12].map((m) => `<button class="chip ${m === 1 ? 'on' : ''}" data-months="${m}">${m === 12 ? '1 an' : m + ' mois'}</button>`).join('')}</div>
      <label class="field"><span>Montant reçu (F CFA)</span><input class="input" id="pay-amount" type="number" value="${state.config.priceFcfa}"></label>
      <p class="muted" id="pay-preview" style="margin:-4px 0 12px"></p>
      <div class="actions"><button class="btn" id="pay-ok">Valider le paiement</button><button class="btn soft" data-act="trial7">Prolonger l'essai de 7 jours</button></div>
    </div>

    <div class="sec">Relancer</div>
    <div class="card">
      <div class="mono" style="white-space:pre-wrap;font-size:13px;margin-bottom:12px">${esc(followUpMessage(x))}</div>
      <div class="actions">
        ${x.phone ? '<button class="btn" id="r-wa">WhatsApp</button>' : ''}
        ${x.email ? '<button class="btn soft" id="r-mail">E-mail</button>' : ''}
        <button class="btn ghost" id="r-copy">Copier</button>
      </div>
    </div>

    <div class="sec">Utilisation (14 derniers jours)</div>
    <div class="card">
      <div class="bars">${vals.map((v, i) => `<div class="bar" title="${days[i]} : ${v} envois"><i style="height:${Math.round(v / max * 100)}%"></i></div>`).join('')}</div>
      <div class="muted" style="margin-top:8px">Envois lus par jour</div>
      <div class="kv" style="margin-top:10px"><span>Ouvertures de l'appli</span><span>${totals('opens')}</span></div>
      <div class="kv"><span>Envois reconnus</span><span>${totals('sends')}</span></div>
      <div class="kv"><span>UV reçues reconnues</span><span>${totals('receipts')}</span></div>
      <div class="kv"><span>SMS non reconnus</span><span>${totals('unrecognized')}</span></div>
      <div class="kv"><span>Rapports partagés / copiés</span><span>${totals('shares')} / ${totals('copies')}</span></div>
      <div class="kv"><span>Dernière activité</span><span>${ago(x.lastSeen)}</span></div>
      <div class="kv"><span>Version · téléphone</span><span>${esc(x.versionName || '—')} · ${esc(d.model || '—')} ${d.android ? '(Android ' + esc(d.android) + ')' : ''}</span></div>

    <div class="sec">SMS non reconnus (chiffres masqués)</div>

    <div class="sec">Erreurs de l'application</div>
    <div class="card">${d.errors.length ? d.errors.map((e) => `<div class="list-item"><div class="muted">${fmtDateTime(e.ts)} · v${esc(e.v)}</div><div class="mono" style="white-space:pre-wrap">${esc(e.msg.slice(0, 600))}</div></div>`).join('') : '<div class="muted">Aucune.</div>'}</div>

      ${x.city || x.activity ? `<p class="muted" style="margin:-4px 0 12px">${esc([x.city, x.activity].filter(Boolean).join(' · '))}${x.prospectId ? ' · inscrit via le lien' : ''}</p>` : ''}
      <label class="field"><span>Note</span><textarea class="input" id="e-note" rows="2">${esc(x.note)}</textarea></label>
      <div class="actions"><button class="btn soft" id="e-save">Enregistrer</button><button class="btn ghost" id="e-msg">Renvoyer le message d'invitation</button></div>
    </div>

    <div class="sec">Sécurité</div>
    <div class="card actions">
      <button class="btn danger" data-act="block">${x.blocked ? 'Débloquer' : 'Bloquer l\'accès'}</button>

      <button class="btn ghost" data-act="pin">Réinitialiser son code PIN</button>
      <button class="btn danger" data-act="delete">Supprimer le client</button>
    </div>
    ${x.pinReset ? `<div class="card" style="margin-top:10px"><div class="muted">Code de réinitialisation du PIN, valable jusqu'au ${fmtDateTime(x.pinReset.exp)} :</div><div class="mono" style="font-size:22px;letter-spacing:3px;margin:6px 0">${esc(x.pinReset.code)}</div></div>` : ''}`;

  $('#d-close').onclick = closeDetail;
  const refresh = async () => { await openDetail(x.code); load(); };
  const act = async (action, data, msg) => {
    try { await api(action, { code: x.code, ...data }); toast(msg); await refresh(); } catch (e) { toast('Erreur : ' + e.message); }
  };
  // Actions sensibles : mot de passe demandé à chaque fois.
  const secure = async (action, data, title, detail, msg) => {
    try { const j = await sensitive(action, { code: x.code, ...data }, title, detail); if (j) { toast(msg); await refresh(); } return j; }
    catch (e) { toast('Erreur : ' + e.message); return null; }
  };
  let months = 1;
  const preview = () => {
    const base = Math.max(Date.now(), x.expiry || Date.now());
    const d = new Date(base); d.setMonth(d.getMonth() + months);
    $('#pay-preview').textContent = `Accès jusqu'au ${fmtDate(d.getTime())}.`;
  };
  document.querySelectorAll('[data-months]').forEach((c) => c.onclick = () => {
    months = Number(c.dataset.months);
    document.querySelectorAll('[data-months]').forEach((o) => o.classList.toggle('on', o === c));
    $('#pay-amount').value = state.config.priceFcfa * months; preview();
  });
  preview();
  $('#pay-ok').onclick = () => {
    const amount = Number($('#pay-amount').value) || state.config.priceFcfa * months;
    secure('pay', { months, amount }, `Paiement de ${money(amount)}`, `${x.name} · ${months === 12 ? '1 an' : months + ' mois'}`, 'Paiement enregistré');
  };
  if ($('#cl-ok')) $('#cl-ok').onclick = () => secure('pay', { months: x.claim.months, amount: x.claim.amount }, `Valider ${money(x.claim.amount)}`, `${x.name} · ${x.claim.months} mois · vérifiez d'abord votre Orange Money`, 'Paiement validé : son appli se débloque à sa prochaine connexion');
  if ($('#cl-no')) $('#cl-no').onclick = () => act('claim_dismiss', {}, 'Déclaration ignorée');
  document.querySelectorAll('[data-act]').forEach((b) => b.onclick = async () => {
    const a = b.dataset.act;
    if (a === 'trial7') return secure('trial', { days: 7 }, 'Prolonger l\'essai de 7 jours', x.name, 'Essai prolongé de 7 jours');

    if (a === 'transfer') return secure('transfer', {}, 'Transférer vers un nouveau téléphone', 'L\'ancien téléphone sera bloqué ; le code pourra être entré sur un nouveau téléphone.', 'Code libéré');
    if (a === 'delete') {
      const j = await secure('delete', {}, `Supprimer ${x.name}`, 'Définitif : son application sera bloquée.', 'Client supprimé');
      if (j) closeDetail();
      return;
    }
    if (a === 'pin') {
      const j = await secure('pin_reset', {}, 'Réinitialiser son code PIN', 'Un code à 6 chiffres valable 24 h sera créé.', 'Code créé');
      if (j?.resetCode) {
        const msg = `Bonjour ${x.name},\n\nVous avez oublié votre code PIN Ravito ? Sur l'écran du code, appuyez sur « Code PIN oublié ? » et entrez ce code : ${j.resetCode}\n\nIl est valable 24 heures. Vous choisirez ensuite un nouveau code PIN ; vos données sont conservées.`;

        $('#m-close').onclick = closeModal;
      }
    }
  });
  document.querySelectorAll('[data-flag]').forEach((cb) => cb.onchange = () => {
    const flags = { ...x.flags }; flags[cb.dataset.flag] = cb.checked;
    act('update', { flags }, 'Fonctions mises à jour');
  });
  $('#e-save').onclick = () => act('update', { name: $('#e-name').value, phone: $('#e-phone').value, email: $('#e-email').value, note: $('#e-note').value }, 'Fiche enregistrée');
  const rm = followUpMessage(x);
  if ($('#r-wa')) $('#r-wa').onclick = () => window.open(waLink(x.phone, rm), '_blank');
  if ($('#r-mail')) $('#r-mail').onclick = () => { location.href = `mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent('Ravito : votre abonnement')}&body=${encodeURIComponent(rm)}`; };
  $('#r-copy').onclick = () => { navigator.clipboard.writeText(rm); toast('Message copié'); };
  $('#e-msg').onclick = () => {
    const msg = inviteMessage(x);
    modal(`<h2 style="margin:0 0 8px">Message d'invitation</h2><div class="card mono" style="white-space:pre-wrap;font-size:13px">${esc(msg)}</div>
      <div class="actions" style="margin-top:14px">${x.phone ? `<a class="btn" target="_blank" href="${esc(waLink(x.phone, msg))}" style="text-decoration:none">Envoyer sur WhatsApp</a>` : ''}
      <button class="btn soft" id="m-copy">Copier</button><button class="btn ghost" id="m-close">Fermer</button></div>`);
    $('#m-copy').onclick = () => { navigator.clipboard.writeText(msg); toast('Message copié'); };
    $('#m-close').onclick = closeModal;
  };
}

/** Message de relance adapté à la situation du client. */
function followUpMessage(x) {
  const prix = money(state.config.priceFcfa), om = state.config.omNumber;
  const pay = `Paiement : ${prix} par mois par Orange Money au ${om}, en indiquant votre code ${x.code}. Ensuite, dans Ravito, appuyez sur « J'ai payé, vérifier ».`;
  if (x.status === 'invite') return `Bonjour ${x.name},\n\nVous n'avez pas encore activé Ravito. Installez l'application avec ce lien :\nhttps://github.com/essanchristian-maker/Ravito/releases/latest/download/Ravito.apk\npuis entrez votre code : ${x.code}\n\nBesoin d'aide ? Répondez à ce message.`;
  if (x.status === 'expire') return `Bonjour ${x.name},\n\nVotre accès à Ravito est arrivé à échéance le ${fmtDate(x.expiry)}. Vos envois continuent d'être enregistrés : vous retrouverez tout dès le renouvellement.\n\n${pay}`;
  if (x.status === 'essai') return `Bonjour ${x.name},\n\nVotre essai gratuit de Ravito se termine le ${fmtDate(x.expiry)}. Est-ce que l'application vous aide pour votre rapport du soir ?\n\nPour continuer : ${pay}`;
  if (x.status === 'bloque') return `Bonjour ${x.name},\n\nVotre accès à Ravito est suspendu. Contactez-nous pour le rétablir.`;
  return `Bonjour ${x.name},\n\nVotre abonnement Ravito se termine le ${fmtDate(x.expiry)}.\n\n${pay}`;
}

              : `<button class="btn" data-convert="${esc(p.id)}">Créer son accès</button>
                 <a class="btn ghost" style="text-decoration:none" target="_blank" href="${esc(waLink(p.whatsapp, `Bonjour ${p.firstName}, merci pour votre inscription à Ravito !`))}">WhatsApp</a>
                 ${p.status === 'nouveau' ? `<button class="btn ghost" data-pstatus="${esc(p.id)}" data-v="contacte">Contacté</button>` : ''}
                 <button class="btn danger" data-pdel="${esc(p.id)}">✕</button>`}
          </div></td>
        </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Aucune demande pour l\'instant. Partagez le lien d\'inscription ci-dessus.</div>'}
  </div>`;
}

function bindProspects() {
  $('#s-copy').onclick = () => { navigator.clipboard.writeText(SIGNUP_URL); toast('Lien copié'); };
  document.querySelectorAll('[data-convert]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { const j = await api('convert', { id: b.dataset.convert }); showInvite(j.client); load(); }
    catch (e) { toast('Erreur : ' + e.message); b.disabled = false; }
  });
  document.querySelectorAll('[data-pstatus]').forEach((b) => b.onclick = async () => {
    try { await api('prospect', { id: b.dataset.pstatus, status: b.dataset.v }); toast('Demande mise à jour'); load(); } catch (e) { toast('Erreur : ' + e.message); }
  });
  document.querySelectorAll('[data-pdel]').forEach((b) => b.onclick = async () => {
    if (!confirm('Supprimer cette demande ?')) return;
    try { await api('prospect_delete', { id: b.dataset.pdel }); toast('Demande supprimée'); load(); } catch (e) { toast('Erreur : ' + e.message); }
  });
  document.querySelectorAll('[data-open]').forEach((b) => b.onclick = () => openDetail(b.dataset.open));
}

// ---------- App installable + notifications
let deferredInstall = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; const b = $('#install'); if (b) { b.style.display = ''; b.onclick = () => { e.prompt(); deferredInstall = null; b.style.display = 'none'; }; } });
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/admin/sw.js', { scope: '/admin/' }).then((r) => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data?.type === 'open') { history.replaceState(null, '', e.data.url); routeFromUrl(); } });
}
const b64ToBytes = (s) => { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };

async function pushStatus() {
  const el = $('#n-state'); if (!el) return;
  if (!('Notification' in window) || !('PushManager' in window)) { el.textContent = 'Ce navigateur ne gère pas les notifications. Sur Android, utilisez Chrome.'; return; }
  const reg = swReg || await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  el.textContent = Notification.permission === 'denied' ? 'Notifications bloquées dans le navigateur : autorisez-les dans les réglages du site.'
    : sub ? '✅ Notifications activées sur cet appareil.' : 'Notifications non activées sur cet appareil.';
}

async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications refusées'); return pushStatus(); }
    const { key } = await api('vapid');
    if (!key) { toast('Notifications pas encore configurées sur le serveur'); return; }
    const reg = swReg || await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
    await api('subscribe', { subscription: sub.toJSON(), label: navigator.userAgent.slice(0, 80) });
    toast('Notifications activées'); pushStatus();
  } catch (e) { toast('Erreur : ' + e.message); }
}

/** Ouvre l'écran demandé par une notification : ?code=XXX ou ?tab=prospects */
function routeFromUrl() {
  const q = new URLSearchParams(location.search);
  if (q.get('tab')) { state.tab = q.get('tab'); render(); }
  if (q.get('code')) openDetail(q.get('code'));
  if (q.get('tab') || q.get('code')) history.replaceState(null, '', '/admin/');
}

if (session.get() && Date.now() - Number(localStorage.getItem('ravito_seen') || 0) < LOCK_MS) load().then(routeFromUrl);
else { session.clear(); renderLogin(); }
</script>
